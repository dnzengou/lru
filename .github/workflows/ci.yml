name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y bc gawk jq shellcheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum

      - name: Shellcheck (non-blocking)
        continue-on-error: true
        run: shellcheck -S warning scripts/*.sh || true

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: Short training run (v8, 10 steps)
        run: sh scripts/neural_mvu_v8.sh --train 10 || true

      - name: Status report
        run: sh scripts/run_universe.sh --status || true

  docker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t lru:ci .
